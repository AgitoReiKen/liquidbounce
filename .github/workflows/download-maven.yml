name: Download Maven Artifacts

on:
  workflow_dispatch: # allows manual triggering in GitHub UI

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo (optional if you need files)
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Use Maven Metadata parser
      - name: Maven Metadata parser
        uses: BoBkiNN/maven-metadata-parser@v1.0.4
        with:
          metadata_url: https://maven.lenni0451.net/everything/de/florianmichael/Classic4J/2.1.1-SNAPSHOT/maven-metadata.xml
          output_dir: ./Classic4J
